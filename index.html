<!DOCTYPE html>
<html lang="en">
<head>

    }

      background: #1f6feb;

      border: none;
      padding: 10px 20px;

    button:hover {

<body>

<header>ZensR6 Coaching</header>

<div class="container">
  <h1>Ranked Ready Coaching</h1>

  </div>

  <div class="card">

</html>
